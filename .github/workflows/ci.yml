name: CI
on:
  pull_request:
  push:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,realtime,supavisor,mailpit,postgres-meta
      - name: Export test env
        run: |
          supabase status -o env | awk -F= '/^API_URL=/{print "SUPABASE_URL="$2} /^ANON_KEY=/{print "SUPABASE_ANON_KEY="$2} /^SERVICE_ROLE_KEY=/{print "SUPABASE_SERVICE_ROLE_KEY="$2}' | tr -d '"' >> "$GITHUB_ENV"
      - run: npm run test:int
      - name: Export app env
        run: |
          supabase status -o env | awk -F= '/^API_URL=/{print "NEXT_PUBLIC_SUPABASE_URL="$2} /^ANON_KEY=/{print "NEXT_PUBLIC_SUPABASE_ANON_KEY="$2} /^SERVICE_ROLE_KEY=/{print "SUPABASE_SERVICE_ROLE_KEY="$2}' | tr -d '"' >> "$GITHUB_ENV"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "CONTACT_EMAIL=ci@example.test"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
